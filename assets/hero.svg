<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 260" width="1000" height="260" role="img" aria-label="Lucas Manoel — AI Systems Engineer">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"  stop-color="#FF9838" stop-opacity=".55"/>
      <stop offset="45%" stop-color="#8E3A0B" stop-opacity=".22"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="discL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#8E3A0B"/>
      <stop offset="38%"  stop-color="#FF9838"/>
      <stop offset="62%"  stop-color="#FFF3DE"/>
      <stop offset="100%" stop-color="#8E3A0B"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FF9838"/><stop offset="100%" stop-color="#FF9838" stop-opacity="0"/>
    </linearGradient>
    <mask id="lower">
      <rect x="0" y="0" width="1000" height="260" fill="#000"/>
      <rect x="0" y="130" width="1000" height="130" fill="#fff"/>
    </mask>
    <style>
      .n { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif; font-weight:700; font-size:44px; fill:#F2F6FA; letter-spacing:-1.2px }
      .k { font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-weight:600; font-size:12px; fill:#FF9838; letter-spacing:3.4px }
      .s { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif; font-weight:400; font-size:14px; fill:#8C9BA8 }
    </style>
  </defs>

  <rect width="1000" height="260" fill="#000000"/>
  <ellipse cx="726" cy="130" rx="290" ry="200" fill="url(#glow)"/>

  <!-- disco: metade de tras passa POR CIMA da sombra (lente gravitacional) -->
  <ellipse cx="726" cy="130" rx="196" ry="30" fill="none" stroke="url(#discL)" stroke-width="15" opacity=".92"/>
  <ellipse cx="726" cy="130" rx="150" ry="21" fill="none" stroke="url(#discL)" stroke-width="9"  opacity=".7"/>

  <!-- sombra do horizonte -->
  <circle cx="726" cy="130" r="62" fill="#000000"/>
  <circle cx="726" cy="130" r="66" fill="none" stroke="#FFF3DE" stroke-width="2" opacity=".85"/>
  <circle cx="726" cy="130" r="70" fill="none" stroke="#FF9838" stroke-width="1.2" opacity=".45"/>

  <!-- metade da frente do disco: por baixo da sombra -->
  <g mask="url(#lower)">
    <ellipse cx="726" cy="130" rx="196" ry="30" fill="none" stroke="url(#discL)" stroke-width="15"/>
    <ellipse cx="726" cy="130" rx="150" ry="21" fill="none" stroke="url(#discL)" stroke-width="9" opacity=".8"/>
  </g>

  <!-- gas orbitando -->
  <g>
    <ellipse cx="726" cy="130" rx="196" ry="30" fill="none" stroke="#FFF3DE" stroke-width="2.6"
             stroke-linecap="round" stroke-dasharray="7 405" opacity=".95">
      <animate attributeName="stroke-dashoffset" values="412;0" dur="3.4s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="726" cy="130" rx="150" ry="21" fill="none" stroke="#FFCE9B" stroke-width="2.2"
             stroke-linecap="round" stroke-dasharray="5 310" opacity=".9">
      <animate attributeName="stroke-dashoffset" values="315;0" dur="2.1s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="726" cy="130" rx="150" ry="21" fill="none" stroke="#FFF3DE" stroke-width="2"
             stroke-linecap="round" stroke-dasharray="4 311" opacity=".75">
      <animate attributeName="stroke-dashoffset" values="472;157" dur="2.1s" repeatCount="indefinite"/>
    </ellipse>
  </g>

  <!-- anel de fotons pulsando -->
  <circle cx="726" cy="130" r="70" fill="none" stroke="#FFF3DE" stroke-width="1">
    <animate attributeName="r"       values="70;92"  dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values=".5;0"   dur="4s" repeatCount="indefinite"/>
  </circle>

  <rect x="0" y="0" width="4" height="260" fill="#FF9838"/>
  <rect x="48" y="196" width="270" height="1.5" fill="url(#rule)"/>
  <text class="k" x="48" y="86">AI SYSTEMS ENGINEER</text>
  <text class="n" x="48" y="138">Lucas Manoel</text>
  <text class="s" x="48" y="176">Agentes de IA em produção · Multi-agent orchestration</text>
  <text class="s" x="48" y="228" style="font-size:12px;fill:#5C6B78">lucas-ai-max</text>
</svg>
